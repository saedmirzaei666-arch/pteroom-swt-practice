<script>
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  // تایمر معکوس ۱۰ دقیقه
  let timeLeft = 600;
  const timerElem = document.getElementById('timer');
  const timerInterval = setInterval(() => {
    timeLeft--;
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;
    timerElem.innerText = `Time Left: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      submitAnswer();
    }
  }, 1000);

  // شمارش کلمات
  function updateWordCount() {
    const text = document.getElementById('answerInput').value.trim();
    const words = text === "" ? 0 : text.split(/\s+/).filter(Boolean).length;
    document.getElementById('wordCount').innerText = `Total Word Count: ${words}`;
  }

  // تابع ارسال پاسخ
  function submitAnswer() {
    const answer = document.getElementById('answerInput').value.trim();
    const passage = document.getElementById('passageText').innerText.trim();

    if (!answer) {
      alert("Please write your answer before submitting.");
      return;
    }

    const payload = JSON.stringify({
      passage: passage,
      user_answer: answer
    });

    if (tg && typeof tg.sendData === "function") {
      try {
        tg.sendData(payload);
        tg.close();
      } catch (err) {
        alert("Error sending data: " + err.message);
      }
    } else {
      alert("Telegram WebApp not detected. Please open from the chat button.");
    }
  }
</script>
