<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PTE ROOM</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --primary: #0056b3; --bg: #eef2f5; --text: #222; }
    * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
    
    html, body {
      margin: 0; padding: 0; background: var(--bg);
      width: 100vw; height: 100vh; overflow: hidden;
    }

    .box {
      display: flex; flex-direction: column; width: 100%; height: 100%;
      padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)) 10px;
    }
    
    .nav-tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-shrink: 0; }
    .tab-btn {
      flex: 1; background: #fff; border: 1px solid #cbd5e1; padding: 8px 2px;
      border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 11px; color: #475569;
    }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .header { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .brand { font-weight: 800; color: var(--primary); font-size: 15px; }
    .timer { font-weight: bold; color: #c00; font-size: 15px; }
    
    .task-container { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .selector-bar { margin-bottom: 10px; }
    select { width: 100%; padding: 10px; border-radius: 6px; border: 1.5px solid var(--primary); font-size: 14px; font-weight: 600; color: var(--primary); }
    
    .audio-container { display: none; margin-bottom: 10px; }
    audio { width: 100%; height: 40px; }

    .prompt-box { flex: 1; background: #fff; padding: 15px; font-size: 15px; line-height: 1.6; overflow-y: auto; border-radius: 8px; border: 1px solid #cbd5e1; margin-bottom: 10px; }
    textarea { width: 100%; min-height: 140px; padding: 12px; font-size: 16px; border: 1px solid #a0aec0; border-radius: 8px; resize: none; }
    
    .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-bottom: 10px; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 14px 24px; border-radius: 8px; font-weight: bold; font-size: 14px; }

    /* Flashcard Style */
    .flashcard-wrapper { display: none; flex-direction: column; flex: 1; align-items: center; }
    .card-scene { width: 100%; flex: 1; perspective: 1000px; margin: 10px 0; }
    .card { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; }
    .card.is-flipped { transform: rotateY(180deg); }
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; background: #fff; border: 1.5px solid #cbd5e1; overflow-y: auto; }
    .card-front { background: var(--primary); color: #fff; justify-content: center; align-items: center; text-align: center; }
    .word-title { font-size: 32px; font-weight: 800; }
    .persian-meaning { font-size: 20px; font-weight: 800; color: var(--primary); margin: 10px 0; }
    .example-sentence { font-size: 15px; background: #f1f5f9; padding: 12px; border-radius: 8px; border-left: 4px solid var(--primary); }
    .leitner-actions { display: flex; width: 100%; gap: 10px; padding-bottom: 20px; }
    .leitner-btn { flex: 1; padding: 16px; border-radius: 8px; font-weight: 800; font-size: 15px; border: none; color: #fff; }
  </style>
</head>
<body>

<div class="box">
  <div class="nav-tabs">
    <button class="tab-btn active" id="tabSWT" onclick="switchTask('SWT')">SWT</button>
    <button class="tab-btn" id="tabWE" onclick="switchTask('WE')">WE</button>
    <button class="tab-btn" id="tabSST" onclick="switchTask('SST')">SST</button>
    <button class="tab-btn" id="tabWFD" onclick="switchTask('WFD')">WFD</button>
    <button class="tab-btn" id="tabFlash" onclick="switchTask('FLASH')">🗂 Flash</button>
  </div>

  <div class="header">
    <span class="brand" id="taskHeading">PTE ROOM</span>
    <span class="timer" id="timer">Time: 10:00</span>
  </div>

  <div class="task-container" id="taskContainer">
    <div class="selector-bar"><select id="questionSelect" onchange="onSelectQuestion()"></select></div>
    <div class="audio-container" id="audioSection"><audio id="audioPlayer" controls></audio></div>
    <div class="prompt-box" id="promptText">Loading...</div>
    <textarea id="answerInput" placeholder="Write here..."></textarea>
    <div class="footer">
      <span class="word-count" id="wordCount">Words: 0</span>
      <button class="btn" onclick="sendResult()">Submit</button>
    </div>
  </div>

  <div class="flashcard-wrapper" id="flashcardContainer">
    <div class="card-scene" onclick="flipCard()">
      <div class="card" id="activeCard">
        <div class="card-face card-front"><div class="word-title" id="frontWord">...</div></div>
        <div class="card-face card-back">
          <div class="persian-meaning" id="backMeaning">...</div>
          <div id="backCollocations" style="font-size:14px; margin:5px 0;"></div>
          <div class="example-sentence" id="backSentence">...</div>
        </div>
      </div>
    </div>
    <div class="leitner-actions">
      <button class="leitner-btn" style="background:#ef4444" onclick="answerCard(false)">🔴 بلد نبودم</button>
      <button class="leitner-btn" style="background:#10b981" onclick="answerCard(true)">🟢 مسلط بودم</button>
    </div>
  </div>
</div>

<script>
  // لود اولیه و تنظیمات تلگرام
  const tg = window.Telegram?.WebApp;
  if(tg) { tg.ready(); tg.expand(); if(tg.requestFullscreen) tg.requestFullscreen(); }

  // [دیتاها را در اینجا قرار دهید]

  // سایر توابع (onSelectQuestion, calcWords, renderFlashcard, ...)
</script>
</body>
</html>
