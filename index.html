<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PTE ROOM - SWT Practice Simulator</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- بارگذاری بانک کامل سوالات -->
  <script src="questions.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 12px; background: #eef2f5; color: #222; }
    .box { background: #fff; border-radius: 8px; border: 1px solid #c9d2db; padding: 14px; max-width: 720px; margin: auto; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0056b3; padding-bottom: 6px; margin-bottom: 10px; }
    .brand { font-weight: 800; color: #0056b3; font-size: 15px; }
    .timer { font-weight: bold; color: #c00; font-size: 14px; }
    
    .selector-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    select { flex: 1; padding: 7px 10px; border-radius: 4px; border: 1px solid #0056b3; font-size: 13.5px; font-weight: 600; background: #f8fafc; color: #0056b3; outline: none; }
    
    .passage { background: #fafbfc; border: 1px solid #dbe2e8; padding: 12px; font-size: 13px; line-height: 1.6; height: 180px; overflow-y: auto; margin-bottom: 10px; border-radius: 4px; text-align: justify; }
    textarea { width: 100%; height: 120px; padding: 10px; font-size: 13.5px; border: 1px solid #a0aec0; border-radius: 4px; resize: none; outline: none; }
    textarea:focus { border-color: #0056b3; box-shadow: 0 0 0 1px #0056b3; }
    
    .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .word-count { font-size: 13px; font-weight: bold; color: #333; }
    .btn { background: #0056b3; color: #fff; border: none; padding: 10px 22px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
    .btn:hover { background: #004494; }
  </style>
</head>
<body>

<div class="box">
  <div class="header">
    <span class="brand">PTE ROOM • Summarize Written Text</span>
    <span class="timer" id="timer">Time Left: 10:00</span>
  </div>

  <div class="selector-bar">
    <select id="questionSelect" onchange="onSelectQuestion()">
      <!-- Options dynamically loaded from questions.js -->
    </select>
  </div>

  <div class="passage" id="passageText">Loading question passage...</div>

  <textarea id="answerInput" placeholder="Write your single sentence summary using the PTE ROOM template..." oninput="calcWords()"></textarea>

  <div class="footer">
    <span class="word-count" id="wordCount">Total Word Count: 0</span>
    <button class="btn" onclick="sendResult()">Submit Response</button>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const selectElem = document.getElementById('questionSelect');

  function initQuestions() {
    if (typeof questions !== 'undefined' && questions.length > 0) {
      questions.forEach((q, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.innerText = `${q.title}`;
        selectElem.appendChild(opt);
      });
      onSelectQuestion();
    } else {
      document.getElementById('passageText').innerText = "Questions bank not found. Please verify questions.js.";
    }
  }

  function onSelectQuestion() {
    const idx = document.getElementById('questionSelect').value;
    document.getElementById('passageText').innerText = questions[idx].text;
    document.getElementById('answerInput').value = "";
    calcWords();
  }

  let sec = 600;
  const timer = setInterval(() => {
    sec--;
    let m = Math.floor(sec / 60);
    let s = sec % 60;
    document.getElementById('timer').innerText = `Time Left: ${m}:${s < 10 ? '0' : ''}${s}`;
    if (sec <= 0) {
      clearInterval(timer);
      sendResult();
    }
  }, 1000);

  function calcWords() {
    let t = document.getElementById('answerInput').value.trim();
    let count = t === "" ? 0 : t.split(/\s+/).filter(Boolean).length;
    document.getElementById('wordCount').innerText = "Total Word Count: " + count;
  }

  function sendResult() {
    let ans = document.getElementById('answerInput').value.trim();
    let p = document.getElementById('passageText').innerText.trim();
    let currentIdx = document.getElementById('questionSelect').value;
    let currentTitle = questions[currentIdx].title;

    if (!ans) {
      alert("Please write your summary response first.");
      return;
    }

    let payload = JSON.stringify({
      question_title: currentTitle,
      passage: p,
      user_answer: ans
    });

    if (tg && typeof tg.sendData === "function") {
      tg.sendData(payload);
      tg.close();
    } else {
      alert("Telegram context not detected.");
    }
  }

  window.onload = initQuestions;
</script>

</body>
</html>
