<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PTE ROOM - Multi-Task Practice Platform</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    html, body {
      margin: 0;
      padding: 6px;
      background: #eef2f5;
      color: #222;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .box {
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 8px;
      border: 1px solid #c9d2db;
      padding: 10px 12px;
      width: 100%;
      height: 100%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    
    .nav-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 6px;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      background: #edf2f7;
      border: 1px solid #cbd5e1;
      padding: 8px 4px;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
      font-size: 11.5px;
      color: #475569;
      text-align: center;
    }
    .tab-btn.active {
      background: #0056b3;
      color: #fff;
      border-color: #0056b3;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid #0056b3;
      padding-bottom: 4px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .brand { font-weight: 800; color: #0056b3; font-size: 13.5px; }
    .timer { font-weight: bold; color: #c00; font-size: 13.5px; }
    
    .selector-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    select {
      flex: 1;
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid #0056b3;
      font-size: 13px;
      font-weight: 600;
      background: #f8fafc;
      color: #0056b3;
      outline: none;
    }
    
    .audio-container {
      display: none;
      margin-bottom: 8px;
      background: #f1f5f9;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      flex-shrink: 0;
    }
    audio { width: 100%; height: 32px; outline: none; }

    .prompt-box {
      flex: 1;
      min-height: 90px;
      background: #fafbfc;
      border: 1px solid #dbe2e8;
      padding: 10px;
      font-size: 13.5px;
      line-height: 1.55;
      overflow-y: auto;
      margin-bottom: 8px;
      border-radius: 4px;
      text-align: justify;
      white-space: pre-line;
      -webkit-overflow-scrolling: touch;
    }

    textarea {
      flex: 1;
      min-height: 100px;
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #a0aec0;
      border-radius: 4px;
      resize: none;
      outline: none;
      -webkit-overflow-scrolling: touch;
    }
    textarea:focus { border-color: #0056b3; box-shadow: 0 0 0 1px #0056b3; }
    
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      flex-shrink: 0;
    }
    .word-count { font-size: 13px; font-weight: bold; color: #333; }
    .btn {
      background: #0056b3;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }
    .btn:hover { background: #004494; }
  </style>
</head>
<body>

<div class="box">
  <div class="nav-tabs">
    <button class="tab-btn active" id="tabSWT" onclick="switchTask('SWT')">SWT (Reading/Writing)</button>
    <button class="tab-btn" id="tabWE" onclick="switchTask('WE')">Write Essay (WE)</button>
    <button class="tab-btn" id="tabSST" onclick="switchTask('SST')">SST (Listening/Writing)</button>
  </div>

  <div class="header">
    <span class="brand" id="taskHeading">PTE ROOM • Summarize Written Text</span>
    <span class="timer" id="timer">Time Left: 10:00</span>
  </div>

  <div class="selector-bar">
    <select id="questionSelect" onchange="onSelectQuestion()"></select>
  </div>

  <div class="audio-container" id="audioSection">
    <div style="font-size: 11.5px; font-weight: bold; margin-bottom: 4px; color: #334155;">🎧 Listen to the lecture:</div>
    <audio id="audioPlayer" controls>
      Your browser does not support audio element.
    </audio>
  </div>

  <div class="prompt-box" id="promptText">Loading prompt...</div>

  <textarea id="answerInput" placeholder="Write your response here..." oninput="calcWords()"></textarea>

  <div class="footer">
    <span class="word-count" id="wordCount">Total Word Count: 0</span>
    <button class="btn" onclick="sendResult()">Submit Response</button>
  </div>
</div>

<script>
  let currentTask = "SWT";
  let timerInterval = null;
  let sec = 600;

  // ۱. بانک سوالات SWT
  const swtQuestions = [
    { id: "#36", title: "#36 Human Remains", text: "Human remains are a fundamental part of the archaeological record, offering unique insights into the lives of individuals and populations in the past. Like many archaeological materials, human remains require distinctive and specialized methods of recovery, analysis, and interpretation, while technological innovations and the accumulation of expertise have enabled archaeologists to extract ever greater amounts of information from assemblages of skeletal material. Alongside analyses of new finds, these advances have consistently thrown new light on existing collections of human remains in museums, universities and other institutions. Given the powerful emotional, social and religious meanings attached to the dead body, it is perhaps unsurprising that human remains pose a distinctive set of ethical questions for archaeologists.\nWith the rise of indigenous rights movements and the emergence of post-colonial nations, the acquisition and ownership of human remains became a divisive and politically loaded issue. It became increasingly clear that many human remains in museum collections around the world represented the traces of colonial exploitation and discredited pseudo-scientific theories of race. In the light of these debates and changing attitudes, some human remains were returned or repatriated to their communities of origin, a process which continues to this day. Recently a new set of challenges to the study of human remains has emerged from a rather unexpected direction: the British government revised its interpretation of nineteenth-century burial legislation in a way that would drastically curtail the ability of archaeologists to study human remains of any age excavated in England and Wales. This paper examines these extraordinary events and the legal, political and ethical questions that they raise." },
    { id: "#39", title: "#39 Malaysia Tourism", text: "Malaysia is also launching its biggest ever tourism campaign in an effort to lure 20 million visitors here this year. Tourism is the Southeast Asian nation's second-largest source of foreign exchange after exports. Malaysia is one of the most pleasant, hassle-free countries to visit in Southeast Asia. Aside from its gleaming 21st century glass towers, it boasts some of the most superb beaches, mountains and national parks in the region.\nAny tourist itinerary would have to begin in the capital, Kuala Lumpur, where you will find the Petronas Twin Towers, which once comprised the world's tallest buildings and now hold the title of second-tallest. Both the 88-story towers soar 1,480 feet high and are connected by a sky-bridge on the 41st floor. The limestone temple Batu Caves, located 9 miles north of the city, have a 328-foot-high ceiling and feature ornate Hindu shrines, including a 141-foot-tall gold-painted statue of a Hindu deity. To reach the caves, visitors have to climb a steep flight of 272 steps. In Sabah state on Borneo island not to be confused with Indonesia's Borneo you'll find the small mushroom-shaped Sipadan island, off the coast of Sabah, rated as one of the top five diving sites in the world. Sipadan is the only oceanic island in Malaysia, rising from a 2,300-foot abyss in the Celebes Sea. You can also climb Mount Kinabalu, the tallest peak in Southeast Asia, visit the Sepilok Orang Utan Sanctuary, go white-water rafting and catch a glimpse of the bizarre proboscis monkey, a primate found only in Borneo with a huge pendulous nose, a characteristic pot belly and strange honking sounds.\nWhile you're in Malaysia, consider a trip to Malacca. In its heyday, this southern state was a powerful Malay sultanate and a booming trading port in the region. Facing the Straits of Malacca, this historical state is now a place of intriguing Chinese streets, antique shops, old temples and reminders of European colonial powers. Another interesting destination is Penang, known as the Pearl of the Orient. This island off the northwest coast of Malaysia boasts of a rich Chinese cultural heritage, good food and beautiful beaches." },
    { id: "#40", title: "#40 Small Wars", text: "In such an environment, warfare is no longer purely directed against the military potential of adversarial states. It is rather directed at infiltrating all areas of their societies and threatening their existences. The comparatively easy access to weapons of mass destruction, in particular low-cost biological agents, is of key concern. Both governmental and non-governmental actors prefer to use force in a way that can be characterized as \"unconventional\" or also as \"small wars\". War waged according to conventions is an interstate phenomenon. The \"small war\" is the archetype of war, in which the protagonists acknowledge no rules and permanently try to violate what conventions do exist. The protagonists of the \"small war\" observe neither international standards nor arms control agreements. They make use of territories where they do not have to fear any sanctions because there is no functioning state to assume charge of such sanctions or because the state in question is too weak to impose such sanctions. This type of war does not provide for any warning time. It challenges not only the external security of the nation states and international community, but also their internal safety." },
    { id: "#180", title: "#180 New Women", text: "In the 1890s there was a positive media feeding frenzy in Britain and in North America both defending and attacking the \"New Woman\". Some commentators have dated the beginning of this very precisely, from March 1894, when the British novelist Sarah Grand first used the label in an article in the North American Review. Grand hailed the New Woman as one who had at last \"solved the problem and proclaimed for herself what was wrong with Home-is-the-Woman's-Sphere, and prescribed the remedy\". Other commentators have seen the term growing out of and crystallizing a steadily swelling debate over several decades about the position of women of the middle classes, their scope for independence, the implications of the access to secondary and higher education which they were beginning to secure, and the legal, financial, social and psychological constraints imposed upon them by marriage.\nThe latter is a more fruitful reading, allowing as it does a consideration of a wider literature over a longer period. Although the structure of the English state and political system favored single-issue campaigns, those involved were often associated, even though their primary targets differed, and they were collectively known to contemporaries as \"the women's movement\"." },
    { id: "#197", title: "#197 Bertrand Russell", text: "Russell was arguably the greatest philosopher of the 20th century and the greatest logician since Aristotle. Analytic philosophy, the dominant philosophy of the twentieth century, owes its existence more to Russell than to any other philosopher. And the system of logic developed by Russell and A.N. Whitehead, based on earlier work by Dedekind, Cantor, Frege, and Peano, broke logic out of its Aristotelian straitjacket. He was also one of the century's leading public intellectuals and won the Nobel Prize for Literature in 1950 \"in recognition of his varied and significant writings in which he champions humanitarian ideals and freedom of thought.\"\nRussell was involved, often passionately, in numerous social and political controversies of his time. For example, he supported suffragists, free thought in religion and morals, and world government; he opposed World War I and the Vietnam War, nationalism, and political persecution. He was jailed in 1918 for anti-war views and in 1961 for his anti-nuclear weapons stance.\nHe was married 4 times and had 3 children. With Dora Russell, he founded the experimental Beacon Hill School. He knew or worked with many of the most prominent figures in late 19th and 20th century philosophy, mathematics, science, literature, and politics. Active as a political and social critic until his end, Russell died in 1970 at the age of 97." },
    { id: "#222", title: "#222 Product Life Cycle", text: "The product life cycle has 4 very clearly defined stages, each with its characteristics that mean different things for businesses that are trying to manage the life cycle of their particular products.\nIntroduction Stage - This stage of the cycle could be the most expensive for a company launching a new product. The size of the market for the product is small, which means sales are low, although they will be increasing. On the other hand, the cost of things like research and development, consumer testing, and the marketing needed to launch the product can be very high, especially if it's a competitive sector.\nGrowth Stage - The growth stage is typically characterized by strong growth in sales and profits, and because the company can start to benefit from economies of scale in production, the profit margins, as well as the overall amount of profit, will increase. This makes it possible for businesses to invest more money in promotional activity to maximize the potential of this growth stage.\nMaturity Stage - During the maturity stage, the product is established and the aim for the manufacturer is now to maintain the market share they have built up. This is probably the most competitive time for most products and businesses need to invest wisely in any marketing they undertake. They also need to consider any product modifications or improvements to the production process which might give them a competitive advantage.\nDecline Stage - Eventually, the market for a product will start to shrink, and this is what's known as the decline stage. This shrinkage could be due to the market becoming saturated (i.e. all the customers who will buy the product have already purchased it), or because the consumers are switching to a different type of product. While this decline may be inevitable, it may still be possible for companies to make some profit by switching to less-expensive production methods and cheaper markets." },
    { id: "#498", title: "#498 Origin of Species", text: "In 1837, at the age of 28, Darwin wrote \"Species Change\" in one of his notebooks, which was the earliest record of his evolutionary ideas. Prior to this, he had sailed around the world for 5 years on the HMS Beagle, observing numerous signs that species were not fixed in South America, Oceania, and other places. After returning to England, he wrote \"Cuidado\" (meaning \"be careful\" in Spanish) in another notebook, realizing that the theory of evolution was a radical and dangerous view, and that there was insufficient evidence to make it public at that time.\nOver the next 20 years, Darwin continuously accumulated a vast amount of data and first presented his views to a small circle of scientists. It was not until 1859, when \"On the Origin of Species\" was published, that his ideas became accessible to the general readership, causing a great sensation. The first edition of 1,250 copies sold out on the day of publication, and the circulation reached 4,250 copies within a year, receiving both praise from the scientific community and fierce criticism from the religious community and conservative forces.\nTo this day, \"On the Origin of Species\" remains one of the most important works in human history, and one of the few works that still has scientific value more than 150 years after its publication. Darwin was well aware that his work was only the beginning. He wrote in the book: \"In the distant future, I see open fields for far more important research.\"" },
    { id: "#482", title: "#482 Electric Cars(C)", text: "Although electric cars were clean, quiet, and simple to operate, the drawback then, as now, was their limited range and long charging time. After 1915, they fell out of vogue as cars powered by internal-combustion engines and fueled with cheap gasoline gained favor.\nAs concerns in recent years have grown about global warming caused by carbon-dioxide emissions, scientists have begun to reconsider electricity as a fuel for vehicles. But today's drivers (U.S. consumers, based on the article's U.S.-centered context) expect a vehicle that is fuel efficient, and a fuel that is readily available in numerous locations and allows instant refueling.\nAlthough electric cars are fairly efficient, they require frequent refueling, and the process is far from instantaneous. They are expensive, too, since normal use causes their US$2,000 lead-acid batteries to wear out in just a few years. And, ironically, electric cars do very little to reduce carbon dioxide emissions, because most U.S. electricity is generated by burning coal and other fossil fuels.\nTo gain U.S. consumer acceptance, the car of the future will need to balance the benefits of electric cars with U.S. consumers' demands for distance and dynamo. The hybrid electric vehicle holds promise as a solution to both these needs." },
    { id: "#503", title: "#503 Triangulation", text: "While multi-method research is experiencing a surge of popularity, there are reasons to worry about whether multi-method applications are producing more grounded, justified, and persuasive inferences than single-method studies. These concerns arise from the 'triangulation' framework as prototypical research design for multi-method social science. Simply put, triangulation designs involve asking the same causal inference question using two different methods, checking same substantive conclusions. The metaphor is to the geometric technique of estimating distance by measuring the angle of sight toward an object from two different vantage points.\nTriangulation in social sciences has major flaws. One is well-known and widely discussed: what conclusion should be drawn when the two methods produce different findings? Unfortunately, the list of intellectually plausible responses to such an outcome is all but unbounded.\nFor example, a scholar could reasonably conclude that both findings are correct but capture different aspects of the phenomenon of interest; that one method or the other displayed fundamental limitations in the analysis; that the divergence provides evidence against the credibility of the assumptions involved in both methods; that the outcome involves a contrast in terms of scope or relevant populations for the two methods; or that the failure to triangulate simply leaves the inference in a state of uncertainty. In decades of writing about triangulation, no definitive guidance has yet emerged about how to respond to divergent findings between the multiple methods in a study." }
  ];

  // ۲. بانک سوالات Write Essay
  const weQuestions = [
    { id: "#WE1", title: "#1 Mass Media & Public Perception", text: "Mass media has a powerful influence on shaping public opinion and perceptions. Do you agree or disagree with the notion that news outlets manipulate public thinking? Support your position with reasons and relevant examples." },
    { id: "#WE2", title: "#2 Climate Change Responsibility", text: "Some people believe that individual actions are negligible in combating climate change and that only governments and large corporations can solve environmental issues. Discuss both views and give your opinion." },
    { id: "#WE3", title: "#3 Artificial Intelligence & Employment", text: "With advancements in artificial intelligence and automation, many traditional jobs are predicted to disappear. Do the benefits of AI outweigh the societal drawbacks of workforce displacement?" },
    { id: "#WE4", title: "#4 Cashless Society Transition", text: "Many developed nations are transitioning toward an entirely cashless economy. What are the major advantages and disadvantages of this transition for individuals and financial institutions?" }
  ];

  // ۳. بانک سوالات SST همراه با فایل‌های صوتی
  const sstQuestions = [
    {
      id: "#136",
      title: "#136 Recycling Water",
      audioUrl: "sst1.mp3",
      text: "Why do we need to recycle water? Because we don’t generate much new water. Chemically the process of generating water, which is basically taking hydrogen and oxygen and burning them to produce water, is not a process that happens a lot anymore. So in terms of our total volume of water in the world, yes it is changing, but it’s not changing significantly relative to the rate at which we are using or demand fresh new water. Now there are a lot of different areas of technology involved in water recycling, and we are later in the interview going to get to industrial use and the reclamation of sewerage. What about in the home at the moment; what sort of technology is being utilized in the home when we talk about water recycling? Well very little on average. Typically in a modern home, we turn on the tap, we take a glass of water, we probably in turning on that tap flush ten glasses of water down the sink. We take a shower, we use fresh water, we do a whole range of things, and there is nominally very little recycling of that. It goes down the drain and it goes off to a wastewater treatment plant. There is actually very, very little recycling at a local level. People don’t actually say well I’m now going to take the water I just used, put it through a sophisticated process and reuse it and have a closed loop. It’s not a closed loop in the home."
    },
    {
      id: "#240",
      title: "#240 Stock Market and Business",
      audioUrl: "sst2.mp3",
      text: "The stock market is where investors connect to buy and sell investments — most commonly, stocks, which are shares of ownership in a public company. When you need groceries, you go to the supermarket. When you're ready to buy stocks or mutual funds, you'll usually buy them online through the stock market, which anyone can access with a brokerage account or employee retirement plan. The term 'stock market' often refers to one of the major stock market indexes. However, there are some different uses of the stock market before and after. In the 18th century, manufacturing companies came into the market. Traditional companies used stocks to raise money, and input money into companies, while modern companies used stocks to output money. From 19th to 20th century, however, modern companies, such as Apple, Google and Microsoft are big enough to earn money, and use stocks differently. The stock market also inclined to put money into big companies."
    }
  ];

  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    
    // فعال‌سازی تمام صفحه کامل در تلگرام
    if (tg.requestFullscreen) {
      tg.requestFullscreen();
    }
    
    // جلوگیری از بسته شدن با اسکرول به پایین
    if (tg.disableVerticalSwipes) {
      tg.disableVerticalSwipes();
    }
  }

  function startTimer(duration) {
    if (timerInterval) clearInterval(timerInterval);
    sec = duration;
    timerInterval = setInterval(() => {
      sec--;
      let m = Math.floor(sec / 60);
      let s = sec % 60;
      document.getElementById('timer').innerText = `Time Left: ${m}:${s < 10 ? '0' : ''}${s}`;
      if (sec <= 0) {
        clearInterval(timerInterval);
        sendResult();
      }
    }, 1000);
  }

  function switchTask(task) {
    currentTask = task;
    document.getElementById('tabSWT').className = task === 'SWT' ? 'tab-btn active' : 'tab-btn';
    document.getElementById('tabWE').className = task === 'WE' ? 'tab-btn active' : 'tab-btn';
    document.getElementById('tabSST').className = task === 'SST' ? 'tab-btn active' : 'tab-btn';
    
    const audioSec = document.getElementById('audioSection');
    const audioPl = document.getElementById('audioPlayer');

    if (task === 'SWT') {
      audioSec.style.display = 'none';
      audioPl.pause();
      document.getElementById('taskHeading').innerText = "PTE ROOM • Summarize Written Text";
      document.getElementById('answerInput').placeholder = "Write your single sentence summary using the PTE ROOM template (5-75 words)...";
      startTimer(600);
      loadOptions(swtQuestions);
    } else if (task === 'WE') {
      audioSec.style.display = 'none';
      audioPl.pause();
      document.getElementById('taskHeading').innerText = "PTE ROOM • Write Essay";
      document.getElementById('answerInput').placeholder = "Write your 200-300 word academic essay here...";
      startTimer(1200);
      loadOptions(weQuestions);
    } else if (task === 'SST') {
      audioSec.style.display = 'block';
      document.getElementById('taskHeading').innerText = "PTE ROOM • Summarize Spoken Text";
      document.getElementById('answerInput').placeholder = "Write your 50-70 word summary based on the lecture key points...";
      startTimer(600);
      loadOptions(sstQuestions);
    }
  }

  function loadOptions(list) {
    const select = document.getElementById('questionSelect');
    select.innerHTML = "";
    list.forEach((q, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.innerText = q.title;
      select.appendChild(opt);
    });
    onSelectQuestion();
  }

  function onSelectQuestion() {
    let list = swtQuestions;
    if (currentTask === 'WE') list = weQuestions;
    if (currentTask === 'SST') list = sstQuestions;

    const idx = document.getElementById('questionSelect').value;
    const q = list[idx];
    
    if (currentTask === 'SST') {
      document.getElementById('promptText').innerText = "🎧 Audio Lecture Active: Please listen to the recording above and write your summary.\n\n(Transcript reference loaded for AI grading evaluation)";
      const audioPl = document.getElementById('audioPlayer');
      audioPl.src = q.audioUrl;
      audioPl.load();
    } else {
      document.getElementById('promptText').innerText = q.text;
    }
    
    document.getElementById('answerInput').value = "";
    calcWords();
  }

  function calcWords() {
    let t = document.getElementById('answerInput').value.trim();
    let count = t === "" ? 0 : t.split(/\s+/).filter(Boolean).length;
    document.getElementById('wordCount').innerText = "Total Word Count: " + count;
  }

  function sendResult() {
    let ans = document.getElementById('answerInput').value.trim();
    let list = swtQuestions;
    if (currentTask === 'WE') list = weQuestions;
    if (currentTask === 'SST') list = sstQuestions;

    let currentIdx = document.getElementById('questionSelect').value;
    let q = list[currentIdx];

    if (!ans) {
      alert("Please write your answer before submitting.");
      return;
    }

    let payload = JSON.stringify({
      task_type: currentTask,
      question_title: q.title,
      prompt: q.text,
      user_answer: ans
    });

    if (tg && typeof tg.sendData === "function") {
      tg.sendData(payload);
      tg.close();
    }
  }

  window.onload = () => switchTask('SWT');
</script>

</body>
</html>
